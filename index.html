<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #F4F7FB; overflow: hidden; color:#152033; }
  * { box-sizing: border-box; font-family: -apple-system, 'Malgun Gothic', sans-serif; }
  #page { display: flex; flex-direction: column; height: 100%; }
  #mapArea { position: relative; flex: 1; min-height: 0; }
  #empty {
    display: flex; align-items: center; justify-content: center; height: 100%;
    color: #66758A; font-size: 13px; text-align: center; padding: 16px;
  }

  /* ===== 지도/로드뷰 좌우 분할 레이아웃 =====
     로드뷰를 열어도 지도가 사라지지 않고 옆에 나란히 보임 (카카오 공식 패턴).
     로드뷰가 닫혀있을 땐 지도가 화면 전체를 씀. */
  #splitWrap { position: absolute; inset: 0; display: flex; }
  #map { flex: 1 1 100%; height: 100%; min-width: 0; }
  #roadview { display: none; flex: 1 1 50%; height: 100%; min-width: 0; border-left: 2px solid #C9D4E3; }
  #splitWrap.split-active #map { flex: 1 1 50%; }
  #splitWrap.split-active #roadview { display: block; }

  /* ===== 상단 검색 영역: 탭(경로검색 / 로드뷰검색) ===== */
  #searchBar {
    position: relative; z-index: 30; flex-shrink: 0;
    background: rgba(255,255,255,.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(194,205,222,.9);
    box-shadow: 0 12px 30px rgba(26,39,64,.08);
  }
  #searchTabs { display: flex; gap: 4px; margin-bottom: 6px; }
  #searchBarHeader {
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; font-size: 12px; color: #526176; padding: 9px 14px 7px;
    transition: color .15s ease;
  }
  #searchBarHeader:hover { color: #172033; }
  #searchBarToggleIcon { transition: transform .25s ease; display: inline-block; }
  #searchBarBody {
    max-height: 46vh; overflow: auto; padding: 0 14px 10px;
    transition: max-height .25s ease, padding .25s ease, opacity .2s ease;
    opacity: 1;
  }
  #searchBarBody.collapsed { max-height: 0; padding-top: 0; padding-bottom: 0; opacity: 0; }
  .search-tab {
    font-size: 11px; padding: 5px 10px; border-radius: 6px; cursor: pointer;
    background: #EEF3FA; color: #526176; border: 1px solid #D7E0EC;
  }
  .search-tab.active { background: #1F6FEB; color: #FFFFFF; font-weight: 800; border-color: #1F6FEB; }
  .search-panel { display: none; }
  .search-panel.active { display: block; }
  .search-row { display: flex; gap: 6px; align-items: center; margin-bottom: 5px; position: relative; }
  .search-row:last-child { margin-bottom: 0; }
  .recent-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .recent-chip {
    font-size: 10.5px; padding: 4px 9px; border-radius: 999px; cursor: pointer;
    background: #F2F6FC; color: #526176; border: 1px solid #D7E0EC; white-space: nowrap;
  }
  .recent-chip:hover { border-color: #1F6FEB; color: #172033; }
  .search-row input {
    flex: 1; min-width: 0; padding: 8px 10px; border-radius: 8px; border: 1px solid #C9D4E3;
    background: #FFFFFF; color: #152033; font-size: 12px;
  }
  .search-row button {
    padding: 8px 12px; border-radius: 8px; border: none; background: #1F6FEB;
    color: #FFFFFF; font-weight: 800; font-size: 12px; cursor: pointer; white-space: nowrap;
  }
  .swap-btn {
    padding: 7px 9px; border-radius: 8px; border: 1px solid #C9D4E3; background: #F2F6FC;
    color: #526176; cursor: pointer; font-size: 12px;
  }
  #searchSuggest {
    display: none; position: absolute; top: 100%; left: 0; right: 0; margin-top: 4px;
    background: #FFFFFF; border: 1px solid #C9D4E3; border-radius: 10px; overflow: hidden; z-index: 40;
    box-shadow: 0 18px 36px rgba(20,31,52,.14);
  }
  .suggest-item { padding: 8px 10px; font-size: 11.5px; color: #152033; cursor: pointer; border-bottom: 1px solid #E2E8F0; }
  .suggest-item:last-child { border-bottom: none; }
  .suggest-item:hover { background: #F4F7FB; }
  .suggest-item .addr { color: #66758A; font-size: 10.5px; margin-top: 2px; }
  #resolveStatus {
    display:none; align-items:center; gap:6px; margin:7px 0 0; padding:7px 9px;
    border:1px solid #D7E0EC; border-radius:9px; background:#F7FAFE; color:#526176;
    font-size:11px; line-height:1.35;
  }
  #resolveStatus.warn { display:flex; border-color:#F4B740; background:#FFF8E6; color:#7A4A00; }
  #resolveStatus.ok { display:flex; border-color:#98D8B7; background:#ECFDF3; color:#146C43; }
  #candidatePanel {
    display:none; grid-template-columns: 1fr; gap:6px;
    max-height: 178px; overflow:auto; margin-top:7px; padding-right:2px;
  }
  .candidate-card {
    width:100%; border:1px solid #D7E0EC; border-radius:8px; background:#FFFFFF; padding:8px 9px;
    box-shadow:0 8px 18px rgba(26,39,64,.06); min-width:0; cursor:pointer; text-align:left;
  }
  .candidate-card:hover { border-color:#1F6FEB; background:#F8FBFF; }
  .candidate-card.warn { border-color:#F4B740; background:#FFFDF4; }
  .candidate-card.blocked { border-color:#FCA5A5; background:#FFF5F5; }
  .candidate-card .c-top { display:flex; align-items:center; gap:6px; min-width:0; }
  .candidate-card .c-no {
    flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center;
    width:20px; height:20px; border-radius:999px; background:#EAF2FF; color:#1F6FEB;
    font-size:10px; font-weight:900;
  }
  .candidate-card .c-title { flex:1; min-width:0; color:#152033; font-size:12px; font-weight:900; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .candidate-card .c-badge { flex-shrink:0; border-radius:999px; padding:2px 6px; background:#EAF2FF; color:#1F6FEB; font-size:9.5px; font-weight:900; }
  .candidate-card .c-addr { color:#66758A; font-size:10.5px; line-height:1.35; margin-top:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .candidate-card .c-foot { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:6px; color:#7C8AA0; font-size:10px; }
  .candidate-card .c-action { color:#1F6FEB; font-weight:900; white-space:nowrap; }

  #rvBack {
    display: none; position: absolute; top: 50px; right: 8px; z-index: 20;
    padding: 7px 12px; border-radius: 6px; border: none; background: #152033;
    color: #FFFFFF; font-size: 12px; cursor: pointer;
  }

  /* ===== 지도 컨트롤 패널 (접기/펼치기) ===== */
	  #ctrlToggle {
	    position: absolute; top: 8px; right: 8px; z-index: 15;
	    width: 34px; height: 34px; border-radius: 8px; border: 1px solid #C9D4E3;
	    background: rgba(255,255,255,.95); color: #172033; cursor: pointer; font-size: 15px;
	  }
	  #quickWheelLock {
	    position:absolute; top:8px; right:50px; z-index:15;
	    width:34px; height:34px; border-radius:8px; border:1px solid #C9D4E3;
	    background:rgba(255,255,255,.95); color:#172033; cursor:pointer; font-size:15px;
	    box-shadow:0 8px 18px rgba(20,31,52,.12);
	  }
	  #quickWheelLock.active { border-color:#1F6FEB; color:#1F6FEB; }
	  #mapControls {
    display: none; position: absolute; top: 46px; right: 8px; z-index: 10;
    background: rgba(255,255,255,.96); border: 1px solid #C9D4E3; border-radius: 10px;
    padding: 6px; flex-direction: column; gap: 4px;
  }
  #mapControls.open { display: flex; }
  .ctrl-row { display: flex; gap: 3px; }
  .ctrl-btn {
    font-size: 10.5px; padding: 5px 8px; border-radius: 5px; border: 1px solid #D7E0EC;
    background: #F2F6FC; color: #526176; cursor: pointer; white-space: nowrap;
  }
  .ctrl-btn.active { background: #1F6FEB; color: #FFFFFF; border-color: #1F6FEB; font-weight: 800; }
  .ctrl-btn.safe { background: rgba(20,108,67,.11); color: #146C43; border-color: rgba(20,108,67,.28); }
  .ctrl-divider { height: 1px; background: #E2E8F0; margin: 2px 0; }
  .route-label {
    padding: 5px 9px; border-radius: 999px; border: 1px solid rgba(255,255,255,.45);
    background: rgba(11,18,32,.92); color: #E8EDF5; font-size: 11px; font-weight: 800;
    box-shadow: 0 8px 18px rgba(0,0,0,.24); white-space: nowrap;
  }
  .route-label.origin { color: #3DDC97; border-color: rgba(61,220,151,.55); }
  .route-label.destination { color: #60A5FA; border-color: rgba(96,165,250,.55); }
  .route-direction {
    padding: 5px 10px; border-radius: 999px; border: 1px solid rgba(245,166,35,.6);
    background: rgba(11,18,32,.94); color: #F5A623; font-size: 12px; font-weight: 1000;
    box-shadow: 0 8px 18px rgba(0,0,0,.24); white-space: nowrap;
  }
</style>
</head>
<body>
  <div id="page">
  <div id="searchBar">
    <div id="searchBarHeader" onclick="toggleSearchBar_()">
      <span>미니 카카오맵 · 주소/장소/경로/로드뷰</span>
      <span id="searchBarToggleIcon">▲</span>
    </div>
    <div id="searchBarBody">
    <div id="searchTabs">
      <div class="search-tab active" id="tabSingle" onclick="switchTab_('single')">장소</div>
      <div class="search-tab" id="tabRoute" onclick="switchTab_('route')">경로</div>
      <div class="search-tab" id="tabRoadview" onclick="switchTab_('roadview')">로드뷰</div>
    </div>

    <div class="search-panel active" id="panelSingle">
      <div class="search-row">
        <input id="singleInput" placeholder="주소 또는 장소명 (예: 세방 부산물류센터)" oninput="onSearchInput_('singleInput')">
        <button onclick="searchSingle_()">검색</button>
      </div>
      <div class="recent-row" id="recentRow_single"></div>
    </div>

    <div class="search-panel" id="panelRoute">
      <div class="search-row">
        <input id="originInput" placeholder="출발지 (주소 또는 장소명)" oninput="onSearchInput_('originInput')" onfocus="lastFocusedField_='originInput'">
      </div>
      <div class="search-row">
        <div class="swap-btn" onclick="swapOD_()">⇅</div>
        <input id="destInput" placeholder="도착지 (주소 또는 장소명)" oninput="onSearchInput_('destInput')" onfocus="lastFocusedField_='destInput'">
        <button onclick="searchRoute_()">경로</button>
      </div>
      <div class="recent-row" id="recentRow_route"></div>
    </div>

    <div class="search-panel" id="panelRoadview">
      <div class="search-row">
        <input id="rvAddr" placeholder="상세주소 또는 장소명 (예: 인천공항, 서구 검암동 535-1)" oninput="onSearchInput_('rvAddr')">
        <button onclick="showRoadview()">로드뷰</button>
      </div>
      <div style="font-size:10.5px; color:#7C8AA0; margin:2px 0 6px; cursor:pointer;" onclick="toggleRvBothMode_()">
        <span id="rvBothToggleIcon">☐</span> 상차지·하차지 둘 다 찍어놓고 골라서 보기
      </div>
      <div class="search-row" id="rvBothRow" style="display:none;">
        <input id="rvOrigin" placeholder="상차지 상세주소">
        <input id="rvDest" placeholder="하차지 상세주소">
        <button onclick="showRoadviewBoth_()">둘 다 표시</button>
      </div>
      <div class="recent-row" id="recentRow_roadview"></div>
    </div>

    <div id="searchSuggest"></div>
    <div id="resolveStatus"></div>
    <div id="candidatePanel"></div>
    </div>
  </div>

  <div id="mapArea">
    <button id="rvBack" onclick="backToMap()">✕ 로드뷰 닫기</button>

	    <button id="quickWheelLock" class="active" onclick="toggleWheelLock_()" title="지도 휠 확대/축소 잠금">🔒</button>
	    <button id="ctrlToggle" onclick="toggleControls_()">⚙️</button>
    <div id="mapControls">
      <div class="ctrl-row">
        <div class="ctrl-btn active" id="typeRoad" onclick="setMapType_('ROADMAP')">지도</div>
        <div class="ctrl-btn" id="typeSky" onclick="setMapType_('SKYVIEW')">스카이뷰</div>
        <div class="ctrl-btn" id="typeHybrid" onclick="setMapType_('HYBRID')">하이브리드</div>
        <div class="ctrl-btn" id="typeRoadview" onclick="enterRoadviewFromMap_()">🚶 로드뷰</div>
      </div>
      <div class="ctrl-row">
        <div class="ctrl-btn active" id="wheelLockBtn" onclick="toggleWheelLock_()" title="지도 휠 확대를 잠그고 페이지 스크롤을 우선합니다">휠 잠금</div>
      </div>
      <div class="ctrl-divider"></div>
      <div class="ctrl-row">
        <div class="ctrl-btn" id="ovTraffic" onclick="toggleOverlay_('TRAFFIC')">🚦 교통정보</div>
        <div class="ctrl-btn" id="ovTerrain" onclick="toggleOverlay_('TERRAIN')">⛰️ 지형도</div>
      </div>
      <div class="ctrl-row">
        <div class="ctrl-btn" id="ovRoadviewRoad" onclick="toggleOverlay_('ROADVIEW')" title="로드뷰 가능한 도로를 표시 (기본은 꺼짐)">🛤️ 로드뷰 가능도로</div>
      </div>
      <div class="ctrl-divider"></div>
      <div class="ctrl-row">
        <div class="ctrl-btn" id="catOL7" onclick="toggleCategory_('OL7')">⛽ 주유소</div>
        <div class="ctrl-btn" id="catCS2" onclick="toggleCategory_('CS2')">🏪 편의점</div>
      </div>
      <div class="ctrl-row">
        <div class="ctrl-btn" id="catPK6" onclick="toggleCategory_('PK6')">🅿️ 주차장</div>
        <div class="ctrl-btn" id="catRest" onclick="toggleRestArea_()">🛣️ 휴게소</div>
      </div>
    </div>

    <div id="empty">카카오맵을 준비하는 중입니다</div>
    <div id="splitWrap" style="display:none;">
      <div id="map"></div>
      <div id="roadview"></div>
    </div>
  </div>
  </div>

  <script>
    // 카카오 개발자센터 > 플랫폼 키 > JavaScript 키 (32자리)
    var KAKAO_APP_KEY = '37f8b239eb412968ced85d7de0951838';

    var map, geocoder, places, kakaoReady = false;
    var markers = [], polylines = [], routeLabels_ = [];
    var geocodeCache = {};
    var activeOverlays = {};
    var currentTab_ = 'route';
    var routeSeq_ = 0;
    var wheelLocked_ = true;
    var resolveSeq_ = 0;
    var pendingResolve_ = {};

    var script = document.createElement('script');
    script.src = '//dapi.kakao.com/v2/maps/sdk.js?appkey=' + KAKAO_APP_KEY + '&libraries=services&autoload=false';
    script.onload = function () {
      kakao.maps.load(function () {
        kakaoReady = true;
        geocoder = new kakao.maps.services.Geocoder();
        places = new kakao.maps.services.Places();
        map = new kakao.maps.Map(document.getElementById('map'), {
          center: new kakao.maps.LatLng(36.5, 127.8), level: 9, scrollwheel: false
        });
        map.setZoomable(false);
        document.getElementById('empty').style.display = 'none';
        document.getElementById('splitWrap').style.display = 'flex';
        map.relayout();

        // 지도를 클릭하면 그 지점으로 로드뷰를 바로 이동 (아래 4-6참고: 이제
        // 화면을 좌우로 나눠서 지도는 그대로 보이면서 로드뷰가 옆에 뜸)
        kakao.maps.event.addListener(map, 'click', function (mouseEvent) {
          goToRoadviewAt_(mouseEvent.latLng);
        });

        renderRecentChips_();
        if (window.parent) window.parent.postMessage({ type: 'MAP_READY' }, '*');
      });
    };
    script.onerror = function () {
      document.getElementById('empty').textContent = '카카오맵 스크립트를 불러오지 못했습니다. 앱 키/도메인 등록을 확인해주세요.';
    };
    document.head.appendChild(script);

    window.addEventListener('wheel', function (e) {
      if (!wheelLocked_) return;
      e.preventDefault();
      if (window.parent) window.parent.postMessage({ type: 'MAP_WHEEL', deltaY: e.deltaY }, '*');
    }, { passive: false });

    function toggleWheelLock_() {
      setWheelLock_(!wheelLocked_);
    }

	    function setWheelLock_(locked) {
	      wheelLocked_ = !!locked;
	      if (map) map.setZoomable(!wheelLocked_);
	      var btn = document.getElementById('wheelLockBtn');
	      if (btn) {
	        btn.classList.toggle('active', wheelLocked_);
	        btn.textContent = wheelLocked_ ? '🔒 휠 잠금' : '🔓 지도 확대';
	      }
	      var quick = document.getElementById('quickWheelLock');
	      if (quick) {
	        quick.classList.toggle('active', wheelLocked_);
	        quick.textContent = wheelLocked_ ? '🔒' : '🔓';
	        quick.title = wheelLocked_ ? '휠 잠금: 페이지 스크롤 우선' : '휠 해제: 지도 확대/축소';
	      }
	    }

    // ===== 검색 탭 전환 =====
    function switchTab_(tab) {
      currentTab_ = tab;
      document.getElementById('tabSingle').classList.toggle('active', tab === 'single');
      document.getElementById('tabRoute').classList.toggle('active', tab === 'route');
      document.getElementById('tabRoadview').classList.toggle('active', tab === 'roadview');
      document.getElementById('panelSingle').classList.toggle('active', tab === 'single');
      document.getElementById('panelRoute').classList.toggle('active', tab === 'route');
      document.getElementById('panelRoadview').classList.toggle('active', tab === 'roadview');
      document.getElementById('searchSuggest').style.display = 'none';
    }

    // ===== 장소 하나만 검색해서 지도에 마커로 표시 (가장 빠르고 단순한 검색) =====
    function searchSingle_() {
      if (!kakaoReady) return;
      document.getElementById('searchSuggest').style.display = 'none';
      var q = document.getElementById('singleInput').value.trim();
      if (!q) return;

      geocodeAddress_(q, function (pos) {
        recordRecentSearch_(q);
        document.getElementById('empty').style.display = 'none';
        document.getElementById('splitWrap').style.display = 'flex';
        map.relayout();
        clearCandidateMarkers_();
        markers.forEach(function (m) { m.setMap(null); });
        polylines.forEach(function (p) { p.setMap(null); });
        markers = []; polylines = [];

        var marker = new kakao.maps.Marker({ map: map, position: pos, title: q });
        kakao.maps.event.addListener(marker, 'click', function () { goToRoadviewAt_(pos); });
        markers.push(marker);
        map.setCenter(pos);
        map.setLevel(4);
      }, function () {
        alert('주소/장소를 찾을 수 없습니다. 정확한 지번·도로명 주소나 장소명을 입력해주세요.');
      }, { renderCandidates: true, fieldId: 'singleInput', expand: true });
    }

    function swapOD_() {
      var o = document.getElementById('originInput');
      var d = document.getElementById('destInput');
      var tmp = o.value; o.value = d.value; d.value = tmp;
    }

    // ===== 지도 컨트롤 패널 접기/펼치기 =====
    function toggleControls_() {
      document.getElementById('mapControls').classList.toggle('open');
    }

    // ===== 검색바(경로검색/로드뷰검색) 접기/펼치기 — 지도를 가리는 게 불편할 때 =====
    function toggleSearchBar_() {
      var body = document.getElementById('searchBarBody');
      var icon = document.getElementById('searchBarToggleIcon');
      body.classList.toggle('collapsed');
      icon.textContent = body.classList.contains('collapsed') ? '▼' : '▲';
    }

    // ===== 지도 위 "🚶 로드뷰" 버튼: 지금 보고 있는 지점(출발지 마커 있으면 그
    // 위치, 없으면 지도 중심)으로 바로 로드뷰 진입 =====
    var lastOriginPos_ = null;
    function enterRoadviewFromMap_() {
      if (!kakaoReady || !map) return;
      var pos = lastOriginPos_ || map.getCenter();
      goToRoadviewAt_(pos);
    }

    // ===== 지도타입 / 오버레이 전환 (교통정보/지형도/스카이뷰 등 카카오 공식 지원 기능) =====
    function setMapType_(typeName) {
      if (!map) return;
      map.setMapTypeId(kakao.maps.MapTypeId[typeName]);
      ['typeRoad', 'typeSky', 'typeHybrid'].forEach(function (id) { document.getElementById(id).classList.remove('active'); });
      var idMap = { ROADMAP: 'typeRoad', SKYVIEW: 'typeSky', HYBRID: 'typeHybrid' };
      document.getElementById(idMap[typeName]).classList.add('active');
    }

    function toggleOverlay_(typeName) {
      if (!map) return;
      var idMap = { TRAFFIC: 'ovTraffic', TERRAIN: 'ovTerrain', ROADVIEW: 'ovRoadviewRoad' };
      var btn = document.getElementById(idMap[typeName]);
      if (activeOverlays[typeName]) {
        map.removeOverlayMapTypeId(kakao.maps.MapTypeId[typeName]);
        activeOverlays[typeName] = false;
        btn.classList.remove('active');
      } else {
        map.addOverlayMapTypeId(kakao.maps.MapTypeId[typeName]);
        activeOverlays[typeName] = true;

      if (hardConflict) score -= 90;
      if (localityConflict) score -= 55;
      if (tokens.length && matched === 0) score -= 20;
      if (tokens.length >= 2 && matched < 2) score -= 18;
      var conflict = !!(hardConflict || localityConflict);
      var autoOk = !conflict && (
        (source === 'address_exact' && score >= 58 && (!tokens.length || matched >= Math.min(tokens.length, 2))) ||
        (source === 'address' && score >= 64 && (!tokens.length || matched >= Math.min(tokens.length, 2))) ||
        (source === 'keyword' && score >= 74 && matched >= Math.min(tokens.length, 2))
      );

      return {
        title: doc.place_name || addressName || text,
        addressName: addressName || text,
        roadAddressName: doc.road_address_name || '',
        source: source,
        variant: variant || query,
        lat: lat,
        lng: lng,
        score: score,
        matched: matched,
        confidence: candidateConfidence_(score),
        conflict: conflict,
        autoOk: autoOk,
        regionGroup: regionGroupFromText_(text),
        rawText: text
      };
    }

    function hasParentResolver_() {
      try { return !!(window.parent && window.parent !== window); } catch (e) { return false; }
    }

    function normalizeServerCandidate_(cand) {
      cand = cand || {};
      return {
        title: cand.title || cand.placeName || cand.addressName || '',
        addressName: cand.addressName || cand.rawText || cand.title || '',
        roadAddressName: cand.roadAddressName || '',
        source: cand.source || 'server',
        variant: cand.variant || '',
        lat: parseFloat(cand.lat),
        lng: parseFloat(cand.lng),
        score: Number(cand.score || 0),
        matched: Number(cand.matched || cand.matchedTokens || 0),
        confidence: cand.confidence || '중간',
        conflict: !!cand.conflict,
        autoOk: !!cand.autoOk,
        rawText: cand.rawText || cand.addressName || cand.title || ''
      };
    }

    function requestParentResolve_(query, cb, options, fallback) {
      var requestId = 'resolve_' + (++resolveSeq_) + '_' + Date.now();
      var settled = false;
      pendingResolve_[requestId] = function (payload) {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        delete pendingResolve_[requestId];
        var list = payload && payload.result && payload.result.candidates
          ? payload.result.candidates.map(normalizeServerCandidate_).filter(function (cand) { return !isNaN(cand.lat) && !isNaN(cand.lng); })
          : [];
        if (list.length) cb(list);
        else fallback();
      };
      var timer = setTimeout(function () {
        if (settled) return;
        settled = true;
        delete pendingResolve_[requestId];
        fallback();
      }, 3600);
      window.parent.postMessage({
        type: 'REQUEST_RESOLVE',
        requestId: requestId,
        query: query,
        options: { expand: !!(options && options.expand), limit: 10 }
      }, '*');
    }

    function resolveCandidates_(query, cb, options) {
      options = options || {};
      if (hasParentResolver_() && !options.localOnly) {
        requestParentResolve_(query, cb, options, function () {
          resolveCandidatesLocal_(query, cb, options);
        });
        return;
      }
      resolveCandidatesLocal_(query, cb, options);
    }

    function resolveCandidatesLocal_(query, cb, options) {
      if (!query || !geocoder || !places) { cb([]); return; }
      options = options || {};
      var normalized = normalizeAddress_(query);
      var cacheKey = 'resolve_v3|' + (options.expand ? 'expand|' : 'fast|') + normalized;
      if (geocodeCache[cacheKey]) { cb(geocodeCache[cacheKey]); return; }
      var all = [];
      var seen = {};
      var known = knownAreaCandidate_(normalized);
      if (known) addDocs([known], 'known_area', normalized, true);
      var variants = options.expand ? searchVariants_(query) : [normalized];
      var pending = variants.length * 3;
      function addDocs(docs, source, variant, alreadyCandidate) {
        (docs || []).forEach(function (doc) {
          var cand = alreadyCandidate ? doc : docToCandidate_(normalized, doc, source, variant);
          if (!cand) return;
          var key = candidateKey_(cand);
          if (seen[key]) {
            if (cand.score > seen[key].score) Object.keys(cand).forEach(function (k) { seen[key][k] = cand[k]; });
            return;
          }
          seen[key] = cand;
          all.push(cand);
        });
      }
      function done() {
        pending -= 1;
        if (pending > 0) return;
        all.sort(function (a, b) {
          if (!!a.autoOk !== !!b.autoOk) return a.autoOk ? -1 : 1;
          return b.score - a.score;
        });
        all = all.slice(0, 8);
        geocodeCache[cacheKey] = all;
        cb(all);
      }
      variants.forEach(function (variant) {
        var exactOptions = { analyze_type: kakao.maps.services.AnalyzeType ? kakao.maps.services.AnalyzeType.EXACT : 'exact' };
        var similarOptions = { analyze_type: kakao.maps.services.AnalyzeType ? kakao.maps.services.AnalyzeType.SIMILAR : 'similar' };
        geocoder.addressSearch(variant, function (result, status) {
          if (status === kakao.maps.services.Status.OK) addDocs(result, 'address_exact', variant);
          done();
        }, exactOptions);
        geocoder.addressSearch(variant, function (result, status) {
          if (status === kakao.maps.services.Status.OK) addDocs(result, 'address', variant);
          done();
        }, similarOptions);
        places.keywordSearch(variant, function (result, status) {
          if (status === kakao.maps.services.Status.OK) addDocs(result, 'keyword', variant);
          done();
        }, { size: 10, sort: kakao.maps.services.SortBy ? kakao.maps.services.SortBy.ACCURACY : 'accuracy' });
      });
    }

    function suggestCandidates_(query, cb) {
      if (!query || !places) { cb([]); return; }
      var normalized = normalizeAddress_(query);
      resolveCandidatesLocal_(normalized, function (result) {
        cb((result || []).filter(function (cand) { return !cand.conflict; }).slice(0, 5));
      }, { expand: true });
    }

    function bestCandidate_(query, candidates, strict) {
      var usable = (candidates || []).filter(function (cand) {
        if (cand.conflict) return false;
        if (strict && cand.autoOk !== true) return false;
        if (!strict && cand.autoOk === false && Number(cand.score || 0) < 72) return false;
        return cand.score >= 20;
      });
      return usable[0] || null;
    }

    function routeCandidateNeedsChoice_(cand) {
      if (!cand) return true;
      if (cand.conflict) return true;
      return cand.autoOk !== true;
    }

    function candidatePos_(cand) {
      return new kakao.maps.LatLng(cand.lat, cand.lng);
    }

    function clearCandidateMarkers_() {
      (candidateMarkers_ || []).forEach(function (m) { m.setMap(null); });
      candidateMarkers_ = [];
    }

    function setResolveStatus_(type, text) {
      var box = document.getElementById('resolveStatus');
      if (!box) return;
      if (!text) {
        box.style.display = 'none';
        box.className = '';
        box.textContent = '';
        return;
      }
      box.className = type || '';
      box.textContent = text;
      box.style.display = 'flex';
    }

    var activeCandidateList_ = [];
    var activeCandidateQuery_ = '';
    var activeCandidateField_ = '';
    var activeCandidateContext_ = {};
    var candidateMarkers_ = [];
    var CANDIDATE_LIMIT_ = 3;

    function closeCandidatePanel_() {
      activeCandidateList_ = [];
      activeCandidateQuery_ = '';
      activeCandidateField_ = '';
      activeCandidateContext_ = {};
      var panel = document.getElementById('candidatePanel');
      if (panel) {
        panel.style.display = 'none';
        panel.innerHTML = '';
      }
      clearCandidateMarkers_();
      setResolveStatus_('', '');
    }

    function candidateSourceLabel_(source) {
      if (source === 'known_area') return '지역';
      if (source === 'address_exact') return '정확주소';
      if (source === 'address') return '주소';
      return '장소';
    }

    function candidateActionLabel_(fieldId, context) {
      if (context && context.purpose === 'route-choice') return context.side === 'origin' ? '상차로 선택' : '하차로 선택';
      if (fieldId === 'originInput') return '출발지 입력';
      if (fieldId === 'destInput') return '도착지 입력';
      if (fieldId === 'rvAddr' || fieldId === 'rvOrigin' || fieldId === 'rvDest') return '로드뷰';
      return '지도 보기';
    }

    function routeOptionCopy_(options) {
      var out = {};
      options = options || {};
      Object.keys(options).forEach(function (key) { out[key] = options[key]; });
      out.routeKey = '';
      return out;
    }

    function renderCandidatePanel_(query, candidates, fieldId, context) {
      var topCandidates = (candidates || []).slice(0, CANDIDATE_LIMIT_);
      activeCandidateList_ = topCandidates;
      activeCandidateQuery_ = query || '';
      activeCandidateField_ = fieldId || '';
      activeCandidateContext_ = context || {};
      var panel = document.getElementById('candidatePanel');
      if (!panel) return;
      if (!topCandidates.length) {
        closeCandidatePanel_();
        if (query) setResolveStatus_('warn', '검색 후보가 없습니다. 시/군/구 또는 상세주소를 조금 더 넣어주세요.');
        return;
      }
      panel.innerHTML = topCandidates.map(function (cand, idx) {
        var badge = candidateSourceLabel_(cand.source);
        var title = cand.title || cand.addressName || '-';
        var addr = cand.roadAddressName || cand.addressName || cand.rawText || '-';
        var cls = cand.conflict ? ' blocked' : (cand.confidence === '낮음' || cand.autoOk === false ? ' warn' : '');
        var scoreText = cand.score ? '점수 ' + Math.round(Number(cand.score)) : '';
        return '<button type="button" class="candidate-card' + cls + '" onclick="useCandidate_(' + idx + ',\'select\')">' +
          '<div class="c-top"><span class="c-no">' + (idx + 1) + '</span><div class="c-title">' + escHtml_(title) + '</div><div class="c-badge">' + badge + ' ' + escHtml_(cand.confidence || '확인') + '</div></div>' +
          '<div class="c-addr">' + escHtml_(addr) + '</div>' +
          '<div class="c-foot"><span>' + escHtml_(scoreText) + '</span><span class="c-action">' + escHtml_(candidateActionLabel_(fieldId, context)) + '</span></div>' +
        '</button>';
      }).join('');
      panel.style.display = 'grid';
      var best = bestCandidate_(query, topCandidates, true);
      setResolveStatus_(best ? 'ok' : 'warn',
        best
          ? '상위 후보 ' + topCandidates.length + '건 중 자동 선택 가능: ' + (best.roadAddressName || best.addressName || best.title)
          : '상위 후보 ' + topCandidates.length + '건입니다. 정확한 상차/하차 위치를 눌러 확인하세요.'
      );
    }

    function showCandidatesOnMap_(candidates) {
      if (!kakaoReady || !map || !candidates || !candidates.length) return;
      document.getElementById('empty').style.display = 'none';
      document.getElementById('splitWrap').style.display = 'flex';
      map.relayout();
      clearCandidateMarkers_();
      var bounds = new kakao.maps.LatLngBounds();
      candidates.slice(0, CANDIDATE_LIMIT_).forEach(function (cand, idx) {
        var pos = candidatePos_(cand);
        var marker = new kakao.maps.Marker({ map: map, position: pos, title: cand.title || cand.addressName || '' });
        var iw = new kakao.maps.InfoWindow({
          content: '<div style="padding:6px 8px;font-size:11px;line-height:1.35;color:#152033;"><b>' +
            escHtml_(String(idx + 1) + '. ' + (cand.title || '후보')) + '</b><br>' +
            escHtml_(cand.roadAddressName || cand.addressName || '') + '</div>'
        });
        kakao.maps.event.addListener(marker, 'click', function () { iw.open(map, marker); });
        candidateMarkers_.push(marker);
        bounds.extend(pos);
      });
      map.setBounds(bounds);
    }

    function useCandidate_(idx, action) {
      var cand = activeCandidateList_[idx];
      if (!cand || !kakaoReady) return;
      var value = cand.roadAddressName || cand.addressName || cand.title || activeCandidateQuery_;
      var context = activeCandidateContext_ || {};
      var fieldId = activeCandidateField_;
      closeCandidatePanel_();
      if (context.purpose === 'route-choice') {
        var side = context.side === 'origin' ? 'origin' : 'destination';
        var targetId = side === 'origin' ? 'originInput' : 'destInput';
        var input = document.getElementById(targetId);
        if (input) input.value = value;
        var confirmed = context.confirmedCandidates || {};
        confirmed[side] = cand;
        var nextOptions = routeOptionCopy_(context.routeOptions || {});
        nextOptions.manual = true;
        nextOptions.confirmedCandidates = confirmed;
        showRoute(
          side === 'origin' ? value : (context.routeOrigin || document.getElementById('originInput').value.trim()),
          side === 'destination' ? value : (context.routeDestination || document.getElementById('destInput').value.trim()),
          nextOptions
        );
        return;
      }
      if (fieldId === 'originInput') {
        document.getElementById('originInput').value = value;
        switchTab_('route');
        return;
      }
      if (fieldId === 'destInput') {
        document.getElementById('destInput').value = value;
        switchTab_('route');
        return;
      }
      var pos = candidatePos_(cand);
      document.getElementById('empty').style.display = 'none';
      document.getElementById('splitWrap').style.display = 'flex';
      map.relayout();
      clearRouteMarkersAndLabels_();
      clearRouteOverlays_();
      clearCandidateMarkers_();
      var marker = new kakao.maps.Marker({ map: map, position: pos, title: value });
      candidateMarkers_.push(marker);
      map.setCenter(pos);
      map.setLevel(4);
      if (fieldId === 'rvAddr' || fieldId === 'rvOrigin' || fieldId === 'rvDest' || action === 'roadview') goToRoadviewAt_(pos);
    }

    function geocodeAddress_(address, cb, onFail, options) {
      if (!address || !geocoder || !places) return;
      options = options || {};
      if (options.confirmedCandidate) {
        cb(candidatePos_(options.confirmedCandidate), options.confirmedCandidate, [options.confirmedCandidate]);
        return;
      }
      var normalized = normalizeAddress_(address);
      resolveCandidates_(normalized, function (candidates) {
        var best = bestCandidate_(normalized, candidates, !!options.strict);
        if (!best && !options.strict) best = (candidates || [])[0] || null;
        if (!best) {
          if (options.renderCandidates) {
            renderCandidatePanel_(normalized, candidates, options.fieldId || '');
            showCandidatesOnMap_(candidates);
          }
          if (onFail) onFail(candidates || []);
          return;
        }
        if (options.renderCandidates) closeCandidatePanel_();
        cb(candidatePos_(best), best, candidates || []);
      }, { expand: !!options.expand });
    }

    function clearRouteOverlays_() {
      polylines.forEach(function (p) { p.setMap(null); });
      polylines = [];
    }

    function clearRouteLabels_() {
      routeLabels_.forEach(function (o) { o.setMap(null); });
      routeLabels_ = [];
    }

    function clearRouteMarkersAndLabels_() {
      markers.forEach(function (m) { m.setMap(null); });
      markers = [];
      clearRouteLabels_();
    }

    function addRouteMarker_(pos, title) {
      var marker = new kakao.maps.Marker({ map: map, position: pos, title: title || '' });
      kakao.maps.event.addListener(marker, 'click', function () { goToRoadviewAt_(pos); });
      markers.push(marker);
      return marker;
    }

    function addRouteLabel_(pos, type, text) {
      var div = document.createElement('div');
      div.className = 'route-label ' + type;
      div.textContent = text;
      var overlay = new kakao.maps.CustomOverlay({
        map: map,
        position: pos,
        content: div,
        yAnchor: 1.9
      });
      routeLabels_.push(overlay);
    }

    function addDirectionLabel_(path) {
      if (!path || !path.length) return;
      var mid = path[Math.floor(path.length / 2)];
      if (!mid) return;
      var div = document.createElement('div');
      div.className = 'route-direction';
      div.textContent = '상차 > 하차';
      var overlay = new kakao.maps.CustomOverlay({
        map: map,
        position: mid,
        content: div,
        yAnchor: 1.2
      });
      routeLabels_.push(overlay);
    }

    // ===== 경로 검색: 출발지/도착지 입력 → (임시 직선 표시 후) 부모창에 실제 도로 경로 요청 =====
    function searchRoute_() {
      if (!kakaoReady) return;
      document.getElementById('searchSuggest').style.display = 'none';
      var origin = document.getElementById('originInput').value.trim();
      var destination = document.getElementById('destInput').value.trim();
      if (!origin || !destination) { alert('출발지와 도착지를 모두 입력해주세요.'); return; }
      recordRecentSearch_(origin);
      recordRecentSearch_(destination);
      showRoute(origin, destination, { manual: true });
    }

    function showRoute(origin, destination, options) {
      if (!kakaoReady) return;
      options = options || {};
      var seq = ++routeSeq_;
      var confirmed = options.confirmedCandidates || {};
      var originInput = document.getElementById('originInput');
      var destInput = document.getElementById('destInput');
      if (originInput) originInput.value = origin || '';
      if (destInput) destInput.value = destination || '';
      document.getElementById('empty').style.display = 'none';
      document.getElementById('splitWrap').style.display = 'flex';
      map.relayout();

      clearRouteMarkersAndLabels_();
      clearRouteOverlays_();
      closeCandidatePanel_();

      geocodeAddress_(origin, function (originPos, originCand, originCandidates) {
        if (seq !== routeSeq_) return;
        map.relayout();
        clearCandidateMarkers_();
        lastOriginPos_ = originPos;
        addRouteMarker_(originPos, '출발: ' + (originCand.addressName || origin));
        addRouteLabel_(originPos, 'origin', '상차 ' + (originCand.title || originCand.addressName || origin));
        map.setCenter(originPos);
        map.setLevel(7);

        if (destination) {
          geocodeAddress_(destination, function (destPos, destCand, destCandidates) {
            if (seq !== routeSeq_) return;
            clearCandidateMarkers_();
            addRouteMarker_(destPos, '도착: ' + (destCand.addressName || destination));
            addRouteLabel_(destPos, 'destination', '하차 ' + (destCand.title || destCand.addressName || destination));
            var bounds = new kakao.maps.LatLngBounds();
            bounds.extend(originPos); bounds.extend(destPos);
            map.setBounds(bounds);

            var originNeedsChoice = routeCandidateNeedsChoice_(originCand);
            var destNeedsChoice = routeCandidateNeedsChoice_(destCand);
            if (options.manual && (originNeedsChoice || destNeedsChoice)) {
              var choiceQuery = originNeedsChoice ? origin : destination;
              var choiceField = originNeedsChoice ? 'originInput' : 'destInput';
              var choiceCandidates = originNeedsChoice ? originCandidates : destCandidates;
              renderCandidatePanel_(choiceQuery, choiceCandidates || [], choiceField, {
                purpose: 'route-choice',
                side: originNeedsChoice ? 'origin' : 'destination',
                routeOrigin: origin,
                routeDestination: destination,
                routeOptions: options,
                confirmedCandidates: confirmed
              });
              showCandidatesOnMap_(choiceCandidates || []);
              setResolveStatus_('warn', '검색 후보가 애매합니다. 아래 후보에서 정확한 위치를 출발지/도착지로 넣은 뒤 다시 경로를 눌러주세요.');
              if (window.parent) {
                window.parent.postMessage({
                  type: 'ROUTE_NEEDS_CANDIDATE_CHOICE',
                  origin: origin,
                  destination: destination,
                  routeOwner: options.routeOwner || '',
                  routeKey: options.routeKey || '',
                  fromDashboardRecord: !!options.fromDashboardRecord
                }, '*');
              }
              return;
            }

            closeCandidatePanel_();

            // ⚠️ 이건 실제 경로가 도착하기 전까지 잠깐 보여주는 임시 표시일 뿐입니다.
            // 최종 결과는 반드시 showRealPath_()로 교체되어야 합니다 (아래 SHOW_PATH 참고).
            polylines.push(new kakao.maps.Polyline({
              map: map, path: [originPos, destPos], strokeWeight: 3,
              strokeColor: '#1F6FEB', strokeOpacity: 0.55, strokeStyle: 'shortdash',
              endArrow: true
            }));
            setResolveStatus_('ok', '상차/하차 후보를 확인했습니다. 경로를 요청합니다.');

            // 부모창(Dashboard.html)에게 실제 도로 경로 계산을 요청.
            // kakao-map.html은 REST 키가 없어서 길찾기 API를 직접 못 부르므로,
            // 반드시 이 다리를 거쳐야 진짜 도로선을 그릴 수 있음.
            if (window.parent) {
              window.parent.postMessage({
                type: 'REQUEST_ROUTE',
                origin: origin,
                destination: destination,
                originCandidate: originCand,
                destinationCandidate: destCand,
                manual: !!options.manual,
                routeOwner: options.routeOwner || '',
                routeKey: options.routeKey || '',
                fromDashboardRecord: !!options.fromDashboardRecord
              }, '*');
            }
          }, function (candidates) {
            if (seq !== routeSeq_) return;
            renderCandidatePanel_(destination, candidates || [], 'destInput', {
              purpose: 'route-choice',
              side: 'destination',
              routeOrigin: origin,
              routeDestination: destination,
              routeOptions: options,
              confirmedCandidates: confirmed
            });
            showCandidatesOnMap_(candidates || []);
            if (window.parent) {
              window.parent.postMessage({
                type: 'ROUTE_NEEDS_CANDIDATE_CHOICE',
                origin: origin,
                destination: destination,
                missing: 'destination',
                routeOwner: options.routeOwner || '',
                routeKey: options.routeKey || '',
                fromDashboardRecord: !!options.fromDashboardRecord
              }, '*');
            }
          }, { strict: true, renderCandidates: true, fieldId: 'destInput', expand: !!(options.manual || options.expand), confirmedCandidate: confirmed.destination });
        }
      }, function (candidates) {
        if (seq !== routeSeq_) return;
        renderCandidatePanel_(origin, candidates || [], 'originInput', {
          purpose: 'route-choice',
          side: 'origin',
          routeOrigin: origin,
          routeDestination: destination,
          routeOptions: options,
          confirmedCandidates: confirmed
        });
        showCandidatesOnMap_(candidates || []);
        if (window.parent) {
          window.parent.postMessage({
            type: 'ROUTE_NEEDS_CANDIDATE_CHOICE',
            origin: origin,
            destination: destination,
            missing: 'origin',
            routeOwner: options.routeOwner || '',
            routeKey: options.routeKey || '',
            fromDashboardRecord: !!options.fromDashboardRecord
          }, '*');
        }
      }, { strict: true, renderCandidates: true, fieldId: 'originInput', expand: !!(options.manual || options.expand), confirmedCandidate: confirmed.origin });
    }

    // 부모창이 실제 카카오 길찾기 API로 계산해서 돌려준 진짜 도로 좌표로
    // 임시 직선을 교체 (경로 검색과 배차건 클릭 양쪽 모두 이 함수를 공유)
    function showRealPath_(path) {
      if (!kakaoReady || !map || !path || path.length < 2) return;
      clearRouteOverlays_();
      clearCandidateMarkers_();

      var kakaoPath = path.map(function (pt) { return new kakao.maps.LatLng(pt[0], pt[1]); });
      polylines.push(new kakao.maps.Polyline({
        map: map, path: kakaoPath, strokeWeight: 5,
        strokeColor: '#1F6FEB', strokeOpacity: 0.88, strokeStyle: 'solid',
        endArrow: true
      }));

      var bounds = new kakao.maps.LatLngBounds();
      kakaoPath.forEach(function (p) { bounds.extend(p); });
      map.setBounds(bounds);
    }

    function showValidatedRoute_(payload) {
      if (!kakaoReady || !map || !payload || !payload.path || payload.path.length < 2) return;
      document.getElementById('empty').style.display = 'none';
      document.getElementById('splitWrap').style.display = 'flex';
      map.relayout();

      clearRouteMarkersAndLabels_();
      clearRouteOverlays_();
      clearCandidateMarkers_();

      var origin = payload.origin || {};
      var destination = payload.destination || {};
      var originPos = origin.lat && origin.lng ? new kakao.maps.LatLng(origin.lat, origin.lng) : null;
      var destPos = destination.lat && destination.lng ? new kakao.maps.LatLng(destination.lat, destination.lng) : null;
      if (originPos) {
        addRouteMarker_(originPos, '상차: ' + (origin.resolved || origin.searched || ''));
        addRouteLabel_(originPos, 'origin', '상차 ' + (origin.resolved || origin.searched || ''));
        lastOriginPos_ = originPos;
      }
      if (destPos) {
        addRouteMarker_(destPos, '하차: ' + (destination.resolved || destination.searched || ''));
        addRouteLabel_(destPos, 'destination', '하차 ' + (destination.resolved || destination.searched || ''));
      }

      var kakaoPath = payload.path.map(function (pt) { return new kakao.maps.LatLng(pt[0], pt[1]); });
      polylines.push(new kakao.maps.Polyline({
        map: map, path: kakaoPath, strokeWeight: 5,
        strokeColor: '#1F6FEB', strokeOpacity: 0.88, strokeStyle: 'solid',
        endArrow: true
      }));
      addDirectionLabel_(kakaoPath);

      var bounds = new kakao.maps.LatLngBounds();
      if (originPos) bounds.extend(originPos);
      if (destPos) bounds.extend(destPos);
      kakaoPath.forEach(function (p) { bounds.extend(p); });
      map.setBounds(bounds);
    }

    function showRoutePoints_(payload) {
      if (!kakaoReady || !map || !payload) return;
      document.getElementById('empty').style.display = 'none';
      document.getElementById('splitWrap').style.display = 'flex';
      map.relayout();

      clearRouteMarkersAndLabels_();
      clearRouteOverlays_();

      var origin = payload.origin || {};
      var destination = payload.destination || {};
      var originPos = origin.lat && origin.lng ? new kakao.maps.LatLng(origin.lat, origin.lng) : null;
      var destPos = destination.lat && destination.lng ? new kakao.maps.LatLng(destination.lat, destination.lng) : null;
      var bounds = new kakao.maps.LatLngBounds();
      if (originPos) {
        addRouteMarker_(originPos, '상차: ' + (origin.resolved || origin.searched || ''));
        addRouteLabel_(originPos, 'origin', '상차 ' + (origin.resolved || origin.searched || ''));
        bounds.extend(originPos);
      }
      if (destPos) {
        addRouteMarker_(destPos, '하차: ' + (destination.resolved || destination.searched || ''));
        addRouteLabel_(destPos, 'destination', '하차 ' + (destination.resolved || destination.searched || ''));
        bounds.extend(destPos);
      }
      if (originPos && destPos) {
        addDirectionLabel_([originPos, destPos]);
        map.setBounds(bounds);
        setResolveStatus_('warn', payload.message || '상차/하차 위치는 표시했지만 실도로 경로는 보류되었습니다. 후보나 상세주소를 확인하세요.');
      } else if (originPos || destPos) {
        map.setCenter(originPos || destPos);
        map.setLevel(5);
        setResolveStatus_('warn', payload.message || '한쪽 위치만 확인되었습니다. 나머지 주소를 더 자세히 입력하세요.');
      }
    }

    window.addEventListener('message', function (e) {
      if (e.data && e.data.type === 'RESOLVE_RESULT') {
        var resolver = pendingResolve_[e.data.requestId || ''];
        if (resolver) resolver(e.data);
        return;
      }
      if (e.data && e.data.type === 'CLEAR_PATH') {
        clearRouteOverlays_();
      }
      if (e.data && e.data.type === 'CLEAR_ROUTE_STATE') {
        backToMap();
        clearRouteMarkersAndLabels_();
        clearRouteOverlays_();
        clearCandidateMarkers_();
        renderCandidatePanel_('', [], '');
        setResolveStatus_('', '');
      }
      if (e.data && e.data.type === 'SET_WHEEL_LOCK') {
        setWheelLock_(e.data.locked);
      }
      if (e.data && e.data.type === 'SHOW_VALIDATED_ROUTE') {
        showValidatedRoute_(e.data);
      }
      if (e.data && e.data.type === 'SHOW_ROUTE_POINTS') {
        showRoutePoints_(e.data);
      }
      if (e.data && e.data.type === 'SHOW_ROUTE') {
        showRoute(e.data.origin, e.data.destination, {
          fromParent: true,
          manual: !!e.data.manual,
          expand: !!e.data.expand,
          routeOwner: e.data.routeOwner || '',
          routeKey: e.data.routeKey || '',
          fromDashboardRecord: !!e.data.fromDashboardRecord
        });
      }
      if (e.data && e.data.type === 'SHOW_PATH') {
        showRealPath_(e.data.path);
      }
      if (e.data && e.data.type === 'RELAYOUT') {
        if (map) map.relayout();
        if (rv) rv.relayout();
      }
    });

    // ===== 검색어 입력시 후보 목록 (경로검색의 출발지/도착지, 로드뷰검색 공용) =====
    var searchDebounce_;
    var activeSearchField_ = null;

    function onSearchInput_(fieldId) {
      clearTimeout(searchDebounce_);
      activeSearchField_ = fieldId;
      var box = document.getElementById('searchSuggest');
      var q = document.getElementById(fieldId).value.trim();
      if (!q || !kakaoReady) { box.style.display = 'none'; return; }

      searchDebounce_ = setTimeout(function () {
        suggestCandidates_(q, function (result) {
          if (!result || !result.length) {
            box.style.display = 'none';
            return;
          }
          box.innerHTML = '';
          result.slice(0, CANDIDATE_LIMIT_).forEach(function (place) {
            var item = document.createElement('div');
            item.className = 'suggest-item';
            item.innerHTML = '<div>' + escHtml_(place.title || place.addressName || '') + '</div><div class="addr">' + escHtml_(place.roadAddressName || place.addressName || '') + '</div>';
            item.onclick = function () {
              var selected = place.roadAddressName || place.addressName || place.title || q;
              document.getElementById(fieldId).value = selected;
              box.style.display = 'none';
              renderCandidatePanel_(q, result, fieldId);
              var pos = candidatePos_(place);
              // 로드뷰 검색창이면 바로 로드뷰로 이동, 경로검색 칸이면 그냥 값만 채움
              if (fieldId === 'rvAddr') { recordRecentSearch_(selected); goToRoadviewAt_(pos); }
            };
            box.appendChild(item);
          });
          box.style.display = 'block';
        });
      }, 300);
    }

    // ===== 로드뷰 ↔ 지도 연동 (동동이): 로드뷰 볼 때 지도 위에 위치/방향 표시 =====
    var rv, rvClient;
    var walkerOverlay_, walkerEl_;

    function initRoadviewIfNeeded_() {
      if (!rv) {
        rv = new kakao.maps.Roadview(document.getElementById('roadview'));
        rvClient = new kakao.maps.RoadviewClient();
      }
    }

    function initWalker_() {
      if (walkerOverlay_) return;
      walkerEl_ = document.createElement('div');
      walkerEl_.style.cssText = 'width:16px;height:16px;border-radius:50%;background:#F5A623;border:3px solid #fff;box-shadow:0 0 0 2px rgba(245,166,35,.4);';
      walkerOverlay_ = new kakao.maps.CustomOverlay({ content: walkerEl_, yAnchor: 0.5 });
    }

    function goToRoadviewAt_(pos) {
      initRoadviewIfNeeded_();
      rvClient.getNearestPanoId(pos, 50, function (panoId) {
        if (panoId === null) { alert('이 위치 근처에는 로드뷰가 없습니다.'); return; }
        document.getElementById('empty').style.display = 'none';

        // 지도를 안 가리고 화면을 좌우로 나눠서, 왼쪽은 지도 오른쪽은 로드뷰가
        // 동시에 보이게 함 (카카오 공식 방식 — 세로로 겹쳐서 보여주던 예전
        // 방식은 지도 보기가 너무 불편했음)
        var wrap = document.getElementById('splitWrap');
        wrap.style.display = 'flex';
        wrap.classList.add('split-active');

        document.getElementById('rvBack').style.display = 'block';
        rv.setPanoId(panoId, pos);
        rv.relayout();
        map.relayout();

        initWalker_();
        walkerOverlay_.setPosition(pos);
        walkerOverlay_.setMap(map);

        kakao.maps.event.addListener(rv, 'position_changed', function () {
          var p = rv.getPosition();
          walkerOverlay_.setPosition(p);
          map.setCenter(p);
        });
      });
    }

    // ===== 상차지·하차지 둘 다 지도에 찍어놓고, 원하는 쪽을 클릭해서 로드뷰로 =====
    function toggleRvBothMode_() {
      var row = document.getElementById('rvBothRow');
      var icon = document.getElementById('rvBothToggleIcon');
      var isOpen = row.style.display !== 'none';
      row.style.display = isOpen ? 'none' : 'flex';
      icon.textContent = isOpen ? '☐' : '☑';
    }

    function showRoadviewBoth_() {
      if (!kakaoReady) return;
      var origin = document.getElementById('rvOrigin').value.trim();
      var dest = document.getElementById('rvDest').value.trim();
      if (!origin || !dest) { alert('상차지와 하차지를 모두 입력해주세요.'); return; }

      document.getElementById('empty').style.display = 'none';
      document.getElementById('splitWrap').style.display = 'flex';
      map.relayout();
      clearCandidateMarkers_();
      markers.forEach(function (m) { m.setMap(null); });
      markers = [];

      geocodeAddress_(origin, function (pos) {
        clearCandidateMarkers_();
        var marker = new kakao.maps.Marker({ map: map, position: pos, title: '상차지: ' + origin });
        kakao.maps.event.addListener(marker, 'click', function () { goToRoadviewAt_(pos); });
        markers.push(marker);
        map.setCenter(pos);
        map.setLevel(6);

        geocodeAddress_(dest, function (pos2) {
          clearCandidateMarkers_();
          var marker2 = new kakao.maps.Marker({ map: map, position: pos2, title: '하차지: ' + dest });
          kakao.maps.event.addListener(marker2, 'click', function () { goToRoadviewAt_(pos2); });
          markers.push(marker2);
          var bounds = new kakao.maps.LatLngBounds();
          bounds.extend(pos); bounds.extend(pos2);
          map.setBounds(bounds);
          alert('상차지·하차지 마커를 지도에 찍었습니다. 원하는 쪽 마커를 클릭하면 그 지점 로드뷰로 들어갑니다.');
        }, function (candidates) {
          renderCandidatePanel_(dest, candidates || [], 'rvDest');
          showCandidatesOnMap_(candidates || []);
          alert('하차지 주소 후보를 먼저 확인해주세요.');
        }, { renderCandidates: true, fieldId: 'rvDest', expand: true });
      }, function (candidates) {
        renderCandidatePanel_(origin, candidates || [], 'rvOrigin');
        alert('상차지 주소 후보를 먼저 확인해주세요.');
      }, { renderCandidates: true, fieldId: 'rvOrigin', expand: true });
    }

    function showRoadview() {
      if (!kakaoReady) return;
      document.getElementById('searchSuggest').style.display = 'none';
      var addr = document.getElementById('rvAddr').value.trim();
      if (!addr) return;

      geocodeAddress_(addr, function (pos) {
        recordRecentSearch_(addr);
        goToRoadviewAt_(pos);
      }, function () {
        alert('주소/장소 후보를 찾지 못했습니다. 시/군/구 또는 상세주소를 조금 더 넣어주세요.');
      }, { renderCandidates: true, fieldId: 'rvAddr', expand: true });
    }

    function backToMap() {
      var wrap = document.getElementById('splitWrap');
      wrap.classList.remove('split-active');
      document.getElementById('rvBack').style.display = 'none';
      if (walkerOverlay_) walkerOverlay_.setMap(null);
      if (map) map.relayout();
    }
  </script>
</body>
</html>
